name: Run backend tests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: noveltl_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d noveltl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_NAME: noveltl_test
      DB_PASSWORD: postgres
      DB_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/noveltl_test
      DB_USER: postgres
      LOG_OUTPUT: STREAM
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: backend-ci-secret-key
      TEST_HOST: localhost
      TEST_NAME: noveltl_test
      TEST_PASSWORD: postgres
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: 6379
      TEST_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/noveltl_test
      TEST_USER: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version-file: backend/pyproject.toml
      - name: Install dependencies
        run: uv --directory backend sync --locked --no-default-groups --group backend --group dev --group agent
      - name: Validate migrations
        run: uv --directory backend run --no-sync alembic upgrade head
      - name: Run tests
        run: uv --directory backend run --no-sync pytest
      - name: Run integration tests
        run: uv --directory backend run --no-sync pytest -m integration
