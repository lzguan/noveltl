name: Run end-to-end tests

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: noveltl_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d noveltl_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_DB_HOST: localhost
      E2E_DB_NAME: noveltl_e2e
      E2E_DB_PASSWORD: postgres
      E2E_DB_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/noveltl_e2e
      E2E_DB_USER: postgres
      E2E_REDIS_HOST: localhost
      E2E_REDIS_PORT: 6379
      LOG_OUTPUT: STREAM
      SECRET_KEY: e2e-ci-secret-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version-file: backend/pyproject.toml
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ./e2e/package.json
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: |
            e2e/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Install backend dependencies
        run: uv --directory backend sync --locked --no-default-groups --group backend --group dev --group agent
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install end-to-end dependencies
        run: pnpm --dir e2e install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: Check end-to-end tests
        run: pnpm --dir e2e check
      - name: Lint end-to-end tests
        run: pnpm --dir e2e lint
      - name: Run end-to-end tests
        run: pnpm --dir e2e test
