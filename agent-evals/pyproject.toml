[project]
name = "noveltl-agent-evals"
version = "0.1.0"
description = "Local evaluation tools for the NovelTL memory agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "noveltl-dev",
    "pydantic>=2.10.0",
    "pydantic-ai>=2.31.0",
    "pyyaml>=6.0.3",
    "textual>=0.89.0",
    "typer>=0.16.0",
]

[project.scripts]
agent-eval = "agent_evals.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pyrefly>=1.2.0",
    "ruff>=0.14.11",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.uv]
package = true
default-groups = ["dev"]
required-version = ">=0.10.0"

[tool.uv.sources]
noveltl-dev = { path = "../backend", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyrefly]
project-includes = ["src", "tests"]
project-excludes = ["**/__pycache__", "**/.*", "**/.venv/**"]
infer-with-first-use = false
