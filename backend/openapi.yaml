components:
  schemas:
    AddLabelOp:
      description: "Pydantic schema for a label add operation. Adds a new label to\
        \ the label data with the given parameters.\n\nAttributes:\n    op: The string\
        \ literal 'add'.\n    dirty: Boolean whether to mark the label as dirty.\n\
        \    entity_group: Optional entity group assigned to the label.\n    score:\
        \ Float score between 0.0 and 1.0 representing how likely this label is to\
        \ be an entity.\n    start_pos: Inclusive start position in the chapter text.\n\
        \    end_pos: Exclusive end position in the chapter text."
      properties:
        dirty:
          default: true
          title: Dirty
          type: boolean
        endPos:
          minimum: 0.0
          title: Endpos
          type: integer
        entityGroup:
          anyOf:
          - maxLength: 64
            type: string
          - type: 'null'
          title: Entitygroup
        op:
          const: add
          title: Op
          type: string
        score:
          default: 1.0
          maximum: 1.0
          minimum: 0.0
          title: Score
          type: number
        startPos:
          minimum: 0.0
          title: Startpos
          type: integer
      required:
      - op
      - startPos
      - endPos
      title: AddLabelOp
      type: object
    AutoLabel:
      description: "Pydantic schema for a single auto-labeled data entry with its\
        \ label data.\n\nAttributes:\n    auto_label_id: UUID identifier for this\
        \ AutoLabel.\n    auto_label_data: List of labels produced by the NER model,\
        \ or None if not yet complete.\n    auto_label_status: Labeling progress for\
        \ this autolabel.\n    auto_label_message: Details on status (e.g. failure\
        \ reason).\n    auto_label_last_job_id: Job id of last request to autogenerate.\n\
        \    chapter_content_id: UUID of chapter content this AutoLabel is for.\n\
        \    run_id: UUID of the AutoLabelRun this autolabel belongs to."
      properties:
        autoLabelData:
          anyOf:
          - items:
              $ref: '#/components/schemas/LabelBase'
            type: array
          - type: 'null'
          title: Autolabeldata
        autoLabelId:
          format: uuid
          title: Autolabelid
          type: string
        autoLabelLastJobId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Autolabellastjobid
        autoLabelMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Autolabelmessage
        autoLabelStatus:
          $ref: '#/components/schemas/AutoLabelProgress'
        chapterContentId:
          format: uuid
          title: Chaptercontentid
          type: string
        runId:
          format: uuid
          title: Runid
          type: string
      required:
      - autoLabelId
      - autoLabelStatus
      - chapterContentId
      - runId
      title: AutoLabel
      type: object
    AutoLabelMeta:
      description: "Pydantic schema for auto-label metadata (no label data payload).\n\
        \nAttributes:\n    auto_label_id: UUID identifier for this AutoLabel.\n  \
        \  auto_label_status: Labeling progress for this autolabel.\n    auto_label_message:\
        \ Details on status.\n    auto_label_last_job_id: Job id of last request to\
        \ autogenerate.\n    chapter_content_id: UUID of chapter content this AutoLabel\
        \ is for.\n    run_id: UUID of the AutoLabelRun this autolabel belongs to."
      properties:
        autoLabelId:
          format: uuid
          title: Autolabelid
          type: string
        autoLabelLastJobId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Autolabellastjobid
        autoLabelMessage:
          anyOf:
          - type: string
          - type: 'null'
          title: Autolabelmessage
        autoLabelStatus:
          $ref: '#/components/schemas/AutoLabelProgress'
        chapterContentId:
          format: uuid
          title: Chaptercontentid
          type: string
        runId:
          format: uuid
          title: Runid
          type: string
      required:
      - autoLabelId
      - autoLabelStatus
      - chapterContentId
      - runId
      title: AutoLabelMeta
      type: object
    AutoLabelMetaWithCid:
      properties:
        autoLabelMeta:
          $ref: '#/components/schemas/AutoLabelMeta'
        chapterId:
          format: uuid
          title: Chapterid
          type: string
      required:
      - autoLabelMeta
      - chapterId
      title: AutoLabelMetaWithCid
      type: object
    AutoLabelProgress:
      description: Status for an autolabel in database. One of 'failed', 'pending',
        'processing', 'done'
      enum:
      - failed
      - pending
      - processing
      - done
      title: AutoLabelProgress
      type: string
    AutoLabelRun:
      description: "Pydantic schema for an autolabel run (batch).\n\nA run groups\
        \ autolabels created together in a single request.\n\nAttributes:\n    run_id:\
        \ UUID identifier for this run.\n    triggered_by: UUID of user who triggered\
        \ the run, or None.\n    model_name: Name of the NER model used.\n    model_params:\
        \ Parameters for the NER model.\n    created_at: When the run was created."
      properties:
        createdAt:
          format: date-time
          title: Createdat
          type: string
        modelName:
          title: Modelname
          type: string
        modelParams:
          anyOf:
          - $ref: '#/components/schemas/CluenerParams'
          - $ref: '#/components/schemas/DoNothingParams'
          title: Modelparams
        novelId:
          format: uuid
          title: Novelid
          type: string
        runId:
          format: uuid
          title: Runid
          type: string
        triggeredBy:
          format: uuid
          title: Triggeredby
          type: string
      required:
      - runId
      - novelId
      - triggeredBy
      - modelName
      - modelParams
      - createdAt
      title: AutoLabelRun
      type: object
    Body_create_chapters_by_upload_chapters_upload_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        novelId:
          format: uuid
          title: Novelid
          type: string
        version:
          const: v1
          title: Version
          type: string
      required:
      - novelId
      - version
      - file
      title: Body_create_chapters_by_upload_chapters_upload_post
      type: object
    Body_login_for_access_token_token_post:
      properties:
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
        client_secret:
          anyOf:
          - type: string
          - type: 'null'
          format: password
          title: Client Secret
        grant_type:
          anyOf:
          - pattern: ^password$
            type: string
          - type: 'null'
          title: Grant Type
        password:
          format: password
          title: Password
          type: string
        scope:
          default: ''
          title: Scope
          type: string
        username:
          title: Username
          type: string
      required:
      - username
      - password
      title: Body_login_for_access_token_token_post
      type: object
    BoolData:
      additionalProperties: false
      properties:
        kind:
          const: value
          default: value
          title: Kind
          type: string
        type:
          const: bool
          default: bool
          title: Type
          type: string
        value:
          $ref: '#/components/schemas/BooleanValue'
      required:
      - value
      title: BoolData
      type: object
    BoolField:
      additionalProperties: false
      properties:
        kind:
          const: field
          default: field
          title: Kind
          type: string
        mutable:
          default: false
          title: Mutable
          type: boolean
        type:
          const: bool
          default: bool
          title: Type
          type: string
      title: BoolField
      type: object
    BooleanValue:
      type: boolean
    CacheEntry:
      properties:
        error:
          anyOf:
          - $ref: '#/components/schemas/CacheError'
          - type: 'null'
        response:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Response
        status:
          enum:
          - pending
          - success
          - failure
          title: Status
          type: string
        status_code:
          anyOf:
          - type: integer
          - type: 'null'
          title: Status Code
      required:
      - status
      - status_code
      - response
      - error
      title: CacheEntry
      type: object
    CacheError:
      properties:
        cacheConflict:
          title: Cacheconflict
          type: boolean
        detail:
          title: Detail
          type: string
      required:
      - detail
      - cacheConflict
      title: CacheError
      type: object
    Chapter:
      description: "Pydantic schema for chapter metadata. Represents a single \"chapter\"\
        \ entry, which groups all its revisions.\n\nAttributes:\n    chapter_id: UUID\
        \ primary key identifier.\n    chapter_num: The chapter number.\n    novel_id:\
        \ UUID foreign key to the novel this chapter belongs to."
      properties:
        chapterId:
          format: uuid
          title: Chapterid
          type: string
        chapterIsPublic:
          title: Chapterispublic
          type: boolean
        chapterNum:
          title: Chapternum
          type: integer
        chapterTitle:
          title: Chaptertitle
          type: string
        novelId:
          format: uuid
          title: Novelid
          type: string
      required:
      - chapterId
      - chapterNum
      - chapterTitle
      - chapterIsPublic
      - novelId
      title: Chapter
      type: object
    ChapterContent:
      description: "Pydantic schema for the text content of a chapter.\n\nAttributes:\n\
        \    chapter_content_text: The full text content of the chapter.\n    chapter_content_version:\
        \ The version number of the text content, used for optimistic concurrency\
        \ control when updating text.\n    chapter_content_id: The UUID of the text\
        \ content, used for optimistic concurrency control when updating text."
      properties:
        chapterContentId:
          format: uuid
          title: Chaptercontentid
          type: string
        chapterContentText:
          title: Chaptercontenttext
          type: string
        chapterContentVersion:
          title: Chaptercontentversion
          type: integer
      required:
      - chapterContentText
      - chapterContentVersion
      - chapterContentId
      title: ChapterContent
      type: object
    ChapterContentMeta:
      description: "Metadata for a ChapterContent.\n\nAttributes:\n    chapter_content_version:\
        \ The version number of the text content, used for optimistic concurrency\
        \ control when updating text.\n    chapter_content_id: The UUID of the text\
        \ content, used for optimistic concurrency control when updating text."
      properties:
        chapterContentId:
          format: uuid
          title: Chaptercontentid
          type: string
        chapterContentVersion:
          title: Chaptercontentversion
          type: integer
      required:
      - chapterContentVersion
      - chapterContentId
      title: ChapterContentMeta
      type: object
    ChapterData:
      description: "Pydantic schema for aggregating a ChapterContent and a Chapter\
        \ together.\n\nAttributes:\n    metadata: The metadata of the chapter, such\
        \ as title and whether it's primary.\n    content: The text content of the\
        \ chapter."
      properties:
        content:
          $ref: '#/components/schemas/ChapterContent'
        metadata:
          $ref: '#/components/schemas/Chapter'
      required:
      - metadata
      - content
      title: ChapterData
      type: object
    CluenerParams:
      description: "Pydantic schema for a Cluener model.\n\nAttributes:\n    chunk_size:\
        \ Integer between 1 and 512. Determines max size of chunks passed to NER model.\
        \ Has default value 500.\n    separators: Dictionary of the form `char : SepPriority`.\
        \ The predict algorithm will prioritize chunks ending in higher priority separators.\
        \ Has default value (read the code to see what it is.)\n    force_chunk: If\
        \ no separators found in some interval, force the chunker to chunk mid-sentence.\
        \ Has default value False.\n\nNotes:\n    To validate this model without injecting\
        \ default values, call `CluenerModelParams.model_validate(..., context={'skip_default_values'\
        \ : True})`."
      properties:
        chunkSize:
          default: 500
          exclusiveMinimum: 0.0
          maximum: 512.0
          title: Chunksize
          type: integer
        forceChunk:
          default: false
          title: Forcechunk
          type: boolean
        modelName:
          const: cluener
          default: cluener
          title: Modelname
          type: string
        separators:
          additionalProperties:
            $ref: '#/components/schemas/SepPriority'
          default:
            ? '

              '
            : 1
            '!': 2
            ',': 3
            .: 2
            ':': 3
            ;: 3
            '?': 2
            "\u3002": 2
            "\uFF01": 2
            "\uFF0C": 3
            "\uFF1A": 3
            "\uFF1B": 3
            "\uFF1F": 2
          title: Separators
          type: object
      title: CluenerParams
      type: object
    CreateAutoLabels:
      description: "Pydantic schema for creating a new autolabel run.\n\nAttributes:\n\
        \    novel_id: UUID of novel to create auto labels for.\n    params: Parameters\
        \ for the NER model. Discriminated by model_name attribute.\n    chapter_ids:\
        \ Optional. Restrict to specific chapter UUIDs.\n    start: Optional. Restrict\
        \ to chapters with number >= start.\n    end: Optional. Restrict to chapters\
        \ with number < end.\n    is_public: Optional. Restrict to chapters with this\
        \ specific public flag."
      properties:
        chapterIds:
          anyOf:
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
          title: Chapterids
        end:
          anyOf:
          - type: integer
          - type: 'null'
          title: End
        isPublic:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ispublic
        novelId:
          format: uuid
          title: Novelid
          type: string
        params:
          discriminator:
            mapping:
              cluener: '#/components/schemas/CluenerParams'
              do_nothing: '#/components/schemas/DoNothingParams'
            propertyName: modelName
          oneOf:
          - $ref: '#/components/schemas/CluenerParams'
          - $ref: '#/components/schemas/DoNothingParams'
          title: Params
        start:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start
      required:
      - novelId
      - params
      title: CreateAutoLabels
      type: object
    CreateAutoLabelsResponse:
      description: "Pydantic schema for the response after creating autolabels.\n\n\
        Attributes:\n    run: The autolabel run that was created.\n    autolabels:\
        \ The list of autolabel entries created in this run."
      properties:
        autolabels:
          items:
            $ref: '#/components/schemas/AutoLabelMetaWithCid'
          title: Autolabels
          type: array
        run:
          $ref: '#/components/schemas/AutoLabelRun'
      required:
      - run
      - autolabels
      title: CreateAutoLabelsResponse
      type: object
    CreateChapter:
      description: "Pydantic schema to validate data for creating a new chapter. The\
        \ novel_id is expected to be passed via the URL path.\n\nAttributes:\n   \
        \ chapter_num: The chapter number to create.\n    chapter_title: Title of\
        \ the chapter. Defaults to empty string.\n    chapter_is_public: Whether the\
        \ chapter is publicly visible. Defaults to False."
      properties:
        chapterIsPublic:
          default: false
          title: Chapterispublic
          type: boolean
        chapterNum:
          title: Chapternum
          type: integer
        chapterTitle:
          default: ''
          title: Chaptertitle
          type: string
      required:
      - chapterNum
      title: CreateChapter
      type: object
    CreateFunctionDefinitionRequest:
      additionalProperties: false
      properties:
        functionDefinition:
          additionalProperties: true
          title: Functiondefinition
          type: object
        functionName:
          maxLength: 100
          minLength: 1
          title: Functionname
          type: string
        namespace:
          maxLength: 100
          minLength: 1
          title: Namespace
          type: string
      required:
      - namespace
      - functionName
      - functionDefinition
      title: CreateFunctionDefinitionRequest
      type: object
    CreateGlossaryMemory:
      properties:
        chapterContentId:
          format: uuid
          title: Chaptercontentid
          type: string
        chapterId:
          format: uuid
          title: Chapterid
          type: string
        memoryContent:
          minLength: 1
          title: Memorycontent
          type: string
        memoryType:
          $ref: '#/components/schemas/MemoryType'
        scope:
          anyOf:
          - $ref: '#/components/schemas/Scope'
          - type: 'null'
        termIds:
          items:
            format: uuid
            type: string
          minItems: 1
          title: Termids
          type: array
      required:
      - chapterId
      - chapterContentId
      - memoryType
      - memoryContent
      - termIds
      title: CreateGlossaryMemory
      type: object
    CreateGlossaryTerm:
      properties:
        term:
          maxLength: 100
          minLength: 1
          title: Term
          type: string
      required:
      - term
      title: CreateGlossaryTerm
      type: object
    CreateLabelData:
      description: "Pydantic schema for validating create requests for label data.\n\
        \nAttributes:\n    chapter_content_id: UUID of chapter content being labelled."
      properties:
        chapterContentId:
          format: uuid
          title: Chaptercontentid
          type: string
      required:
      - chapterContentId
      title: CreateLabelData
      type: object
    CreateLabelDataByAutoLabel:
      description: "Pydantic schema to specifiy a set of AutoLabels to be moved to\
        \ LabelDatas.\n\nAttributes:\n    run_id: UUID of the autolabel run whose\
        \ results should be promoted.\n    chapter_ids: Optional filter on what chapters\
        \ to include.\n    start: Optional filter on the least chapter number to include.\n\
        \    end: Optional filter on the greatest chapter number to include."
      properties:
        chapterIds:
          anyOf:
          - items:
              format: uuid
              type: string
            type: array
          - type: 'null'
          title: Chapterids
        end:
          anyOf:
          - type: integer
          - type: 'null'
          title: End
        runId:
          format: uuid
          title: Runid
          type: string
        start:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start
      required:
      - runId
      title: CreateLabelDataByAutoLabel
      type: object
    CreateLabelDataByAutoLabelStatus:
      description: "Return message for CreateLabelDataByAutoLabel.\n\nAttributes:\n\
        \    success: List of tuples of (chapter_id, chapter_content_id) for successful\
        \ inserts.\n    errors: List of tuples of (chapter_id, chapter_content_id,\
        \ error message) for failed inserts."
      properties:
        errors:
          items:
            maxItems: 3
            minItems: 3
            prefixItems:
            - format: uuid
              type: string
            - format: uuid
              type: string
            - type: string
            type: array
          title: Errors
          type: array
        success:
          items:
            maxItems: 2
            minItems: 2
            prefixItems:
            - format: uuid
              type: string
            - format: uuid
              type: string
            type: array
          title: Success
          type: array
      required:
      - success
      - errors
      title: CreateLabelDataByAutoLabelStatus
      type: object
    CreateLabelGroup:
      description: "Pydantic schema for validating forms for creating a label group.\n\
        \nAttributes:\n    label_group_name: Name of label group to create.\n    novel_id:\
        \ UUID of novel this label group belongs to."
      properties:
        labelGroupName:
          maxLength: 31
          title: Labelgroupname
          type: string
        novelId:
          format: uuid
          title: Novelid
          type: string
      required:
      - labelGroupName
      - novelId
      title: CreateLabelGroup
      type: object
    CreateMemoryGroup:
      properties:
        memoryGroupName:
          maxLength: 100
          minLength: 1
          title: Memorygroupname
          type: string
        memoryLanguage:
          maxLength: 2
          minLength: 2
          title: Memorylanguage
          type: string
        novelId:
          format: uuid
          title: Novelid
          type: string
      required:
      - memoryGroupName
      - novelId
      - memoryLanguage
      title: CreateMemoryGroup
      type: object
    CreateMemoryJob:
      properties:
        endChapterNum:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Endchapternum
        memoryGroupId:
          format: uuid
          title: Memorygroupid
          type: string
        params:
          $ref: '#/components/schemas/JobParams'
        startChapterNum:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          title: Startchapternum
      required:
      - memoryGroupId
      - params
      title: CreateMemoryJob
      type: object
    CreateNovel:
      description: "Pydantic schema to validate forms for creating a novel.\n\nAttributes:\n\
        \    novel_title: Novel title to create.\n    novel_description: Description\
        \ of novel we are creating.\n    novel_author: Author of novel we are creating.\n\
        \    novel_visibility: Visibility level of novel we are creating.\n    novel_type:\
        \ Type of novel we are creating.\n    language_code: String code key to language\
        \ of novel we are creating.\n    source_work_id: Optional source work to attach\
        \ to. If None, a new source work is auto-created."
      properties:
        languageCode:
          title: Languagecode
          type: string
        novelAuthor:
          anyOf:
          - type: string
          - type: 'null'
          title: Novelauthor
        novelDescription:
          anyOf:
          - type: string
          - type: 'null'
          title: Noveldescription
        novelTitle:
          title: Noveltitle
          type: string
        novelType:
          $ref: '#/components/schemas/NovelType'
        novelVisibility:
          $ref: '#/components/schemas/Visibility'
        sourceWorkId:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Sourceworkid
      required:
      - novelTitle
      - novelVisibility
      - novelType
      - languageCode
      title: CreateNovel
      type: object
    CreateSourceWork:
      description: "Pydantic schema to validate forms for creating a source work.\n\
        \nAttributes:\n    source_work_title: Title of the source work to create.\n\
        \    source_work_description: Optional description."
      properties:
        sourceWorkDescription:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourceworkdescription
        sourceWorkTitle:
          title: Sourceworktitle
          type: string
      required:
      - sourceWorkTitle
      title: CreateSourceWork
      type: object
    CreateUser:
      description: "Pydantic schema to validate data required to create a user.\n\n\
        Attributes:\n    user_name: Username of user being created.\n    user_password:\
        \ Unhashed password of user being create.\n    user_type: UserType type of\
        \ user to be created.\nNotes:"
      properties:
        userName:
          title: Username
          type: string
        userPassword:
          title: Userpassword
          type: string
        userType:
          $ref: '#/components/schemas/UserType'
      required:
      - userName
      - userPassword
      - userType
      title: CreateUser
      type: object
    Creator:
      enum:
      - user
      - workflow
      - agent
      title: Creator
      type: string
    DataObj:
      additionalProperties: false
      properties:
        fields:
          additionalProperties:
            $ref: '#/components/schemas/DataType'
          maxProperties: 256
          propertyNames:
            $ref: '#/components/schemas/FieldName'
          title: Fields
          type: object
        kind:
          const: object
          default: object
          title: Kind
          type: string
      title: DataObj
      type: object
    DataType:
      discriminator:
        mapping:
          bool: '#/components/schemas/BoolData'
          float: '#/components/schemas/FloatData'
          int: '#/components/schemas/IntData-Output'
          labelRef: '#/components/schemas/LabelRefData'
          string: '#/components/schemas/StringData'
          textSpan: '#/components/schemas/TextSpanData'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/StringData'
      - $ref: '#/components/schemas/IntData-Output'
      - $ref: '#/components/schemas/FloatData'
      - $ref: '#/components/schemas/BoolData'
      - $ref: '#/components/schemas/TextSpanData'
      - $ref: '#/components/schemas/LabelRefData'
    DeleteLabelOp:
      description: "Pydantic schema for a label delete operation. Deletes the label\
        \ with label_id.\n\nAttributes:\n    op: The string literal 'delete'.\n  \
        \  label_id: ID of the label to delete."
      properties:
        labelId:
          format: uuid
          title: Labelid
          type: string
        op:
          const: delete
          title: Op
          type: string
      required:
      - op
      - labelId
      title: DeleteLabelOp
      type: object
    DeleteUserStatus:
      description: "Pydantic schema to return status after deleting a user\n\nAttributes:\n\
        \    status: One of 'success', 'fail', 'verify'.\n    detail: String denoting\
        \ details of operation."
      properties:
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        status:
          enum:
          - success
          - fail
          - verify
          title: Status
          type: string
      required:
      - status
      title: DeleteUserStatus
      type: object
    DetailHTTPErrorResponse:
      description: "Generic error payload for HTTPException responses that only return\
        \ a detail string.\n\nAttributes:\n    detail: Human-readable description\
        \ of the error."
      properties:
        detail:
          title: Detail
