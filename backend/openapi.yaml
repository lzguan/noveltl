info:
  title: FastAPI
  version: 0.1.0
openapi: 3.1.0
paths:
  /auto-label-runs:
    get:
      description: "List autolabel runs for a novel.\n\nArgs:\n    novel_id: UUID\
        \ of novel to query runs for.\n    mine: If true, only return runs triggered\
        \ by the current user."
      operationId: read_auto_label_runs_auto_label_runs_get
      parameters:
      - in: query
        name: novelId
        required: true
        schema:
          format: uuid
          title: Novelid
          type: string
      - in: query
        name: mine
        required: false
        schema:
          default: false
          title: Mine
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AutoLabelRun'
                title: Response Read Auto Label Runs Auto Label Runs Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Read Auto Label Runs
  /auto-label-runs/{runId}/auto-labels:
    get:
      description: "Get autolabel metadata for all autolabels in a run.\n\nArgs:\n\
        \    run_id: UUID of the run.\n    start: Optional inclusive lower bound on\
        \ chapter number.\n    end: Optional exclusive upper bound on chapter number."
      operationId: read_auto_labels_by_run_auto_label_runs__runId__auto_labels_get
      parameters:
      - in: path
        name: runId
        required: true
        schema:
          format: uuid
          title: Runid
          type: string
      - in: query
        name: start
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start
      - in: query
        name: end
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: End
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AutoLabelMetaWithCid'
                title: Response Read Auto Labels By Run Auto Label Runs  Runid  Auto
                  Labels Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Read Auto Labels By Run
  /auto-labels:
    post:
      description: 'Create a new autolabel run and autolabels for matching chapters.


        The run is created first, then autolabel entries are inserted for each

        matching chapter. Worker tasks are dispatched for each autolabel.'
      operationId: create_autolabels_auto_labels_post
      parameters:
      - in: query
        name: requestKey
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Requestkey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutoLabels'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAutoLabelsResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailHTTPErrorResponse'
          description: Invalid request data.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailHTTPErrorResponse'
          description: Novel not found or inaccessible.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestConflictErrorResponse'
          description: Request key conflict.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Autolabels
  /auto-labels/{autoLabelId}:
    get:
      description: "Retrieve a single autolabel with its label data.\n\nArgs:\n  \
        \  auto_label_id: UUID of the autolabel."
      operationId: read_autolabel_by_id_auto_labels__autoLabelId__get
      parameters:
      - in: path
        name: autoLabelId
        required: true
        schema:
          format: uuid
          title: Autolabelid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoLabel'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Read Autolabel By Id
  /cached/{cachedId}:
    get:
      operationId: get_cached_result_cached__cachedId__get
      parameters:
      - in: path
        name: cachedId
        required: true
        schema:
          format: uuid
          title: Cachedid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheEntry'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailHTTPErrorResponse'
          description: Cached result not found.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Cached Result
  /chapter-contents/{chapterContentId}:
    get:
      description: "Endpoint for retrieving a specific version of chapter content\
        \ by its id.\n\nRaises:\n    404: Chapter content not found (or insufficient\
        \ permissions)."
      operationId: read_chapter_content_by_id_chapter_contents__chapterContentId__get
      parameters:
      - in: path
        name: chapterContentId
        required: true
        schema:
          format: uuid
          title: Chaptercontentid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterContent'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Read Chapter Content By Id
  /chapters:
    get:
      description: "Endpoint for retrieving chapters by novel_id.\n\nRaises:\n   \
        \ 404: Novel not found (or insufficient permissions)."
      operationId: read_chapters_by_novel_chapters_get
      parameters:
      - in: query
        name: novelId
        required: true
        schema:
          format: uuid
          title: Novelid
          type: string
      - in: query
        name: start
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start
      - in: query
        name: end
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: End
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Chapter'
                title: Response Read Chapters By Novel Chapters Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Read Chapters By Novel
  /chapters/upload:
    post:
      description: "Create one or more chapters and their initial content versions\
        \ atomically.\n\nRaises:\n    400: The upload request cannot be processed.\n\
        \    401: Authentication failed or the user cannot add chapters to this novel.\n\
        \    404: The authenticated user or requested novel was not found.\n    409:\
        \ One or more chapter numbers already exist in this novel."
      operationId: create_chapters_by_upload_chapters_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_chapters_by_upload_chapters_upload_post'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Chapter'
                title: Response Create Chapters By Upload Chapters Upload Post
                type: array
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailHTTPErrorResponse'
          description: The upload request cannot be processed.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailHTTPErrorResponse'
          description: Authentication failed or the user cannot add chapters to this
            novel.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailHTTPErrorResponse'
          description: The authenticated user or requested novel was not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailHTTPErrorResponse'
          description: One or more chapter numbers already exist in this novel.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Create Chapters By Upload
  /chapters/{chapterId}:
    delete:
      description: "Delete a chapter from the database.\n\nRaises:\n    404: Chapter\
        \ not found.\n    401: Insufficient permissions.\n    500: Delete failed for\
        \ other reasons."
      operationId: delete_chapter_chapters__chapterId__delete
      parameters:
      - in: path
        name: chapterId
        required: true
        schema:
          format: uuid
          title: Chapterid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Delete Chapter
    get:
      description: "Endpoint for retrieving chapter by id.\n\nRaises:\n    404: Chapter\
        \ not found (or insufficient permissions)."
      operationId: read_chapter_by_id_chapters__chapterId__get
      parameters:
      - in: path
        name: chapterId
        required: true
        schema:
          format: uuid
          title: Chapterid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Read Chapter By Id
    patch:
      description: "Update chapter metadata.\n\nRaises:\n    404: Chapter not found.\n\
        \    401: Insufficient permissions.\n    400: Field in request too long."
      operationId: update_chapter_chapters__chapterId__patch
      parameters:
      - in: path
        name: chapterId
        required: true
        schema:
          format: uuid
          title: Chapterid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChapter'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update Chapter
  /chapters/{chapterId}/content:
    get:
      description: "Endpoint for retrieving the most recent content of a chapter.\n\
        \nRaises:\n    404: Chapter not found, or chapter has no content."
      operationId: read_chapter_content_chapters__chapterId__content_get
      parameters:
      - in: path
        name: chapterId
        required: true
        schema:
          format: uuid
          title: Chapterid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterContent'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Read Chapter Content
    patch:
      description: "Apply text operations to the most recent content of a chapter.\
        \ Uses optimistic concurrency\nvia chapter_content_id -- if the content has\
        \ been modified since the client last fetched it,\na 409 is returned.\n\n\
        Raises:\n    404: Chapter content not found.\n    409: Chapter content is\
        \ outdated (someone else modified it).\n    401: Insufficient permissions\
        \ to modify this chapter."
      operationId: update_chapter_content_chapters__chapterId__content_patch
      parameters:
      - in: path
        name: chapterId
        required: true
        schema:
          format: uuid
          title: Chapterid
          type: string
      - in: query
        name: requestKey
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Requestkey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChapterContent'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifyChapterContentResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailHTTPErrorResponse'
          description: Insufficient permissions to modify this chapter.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailHTTPErrorResponse'
          description: Chapter content not found.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestConflictErrorResponse'
          description: Chapter content is outdated, or the request key already exists.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Update Chapter Content
  /chapters/{chapterId}/content-status/{chapterContentId}:
    get:
      description: "Check whether a chapter_content_id is the latest version for a\
        \ chapter.\n\nRaises:\n    404: Chapter content not found (or insufficient\
        \ read permissions).\n    409: Chapter content is outdated."
      operationId: read_chapter_content_status_chapters__chapterId__content_status__chapterContentId__get
      parameters:
      - in: path
        name: chapterId
        required: true
        schema:
          format: uuid
          title: Chapterid
          type: string
      - in: path
        name: chapterContentId
        required: true
        schema:
          format: uuid
          title: Chaptercontentid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationStatus'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Read Chapter Content Status
  /chapters/{chapterId}/content-versions:
    get:
      description: 'Endpoint for retrieving all content version metadata for a chapter.

        Returns an empty list if the chapter has no content versions or doesn''t exist.'
      operationId: read_chapter_content_versions_chapters__chapterId__content_versions_get
      parameters:
      - in: path
        name: chapterId
        required: true
        schema:
          format: uuid
          title: Chapterid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ChapterContentMeta'
                title: Response Read Chapter Content Versions Chapters  Chapterid  Content
                  Versions Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Read Chapter Content Versions
  /chapters/{chapterId}/publish:
    post:
      description: "Publish a chapter (make it public).\n\nRaises:\n    404: Chapter\
        \ not found.\n    401: Insufficient permissions."
      operationId: action_publish_chapter_chapters__chapterId__publish_post
      parameters:
      - in: path
        name: chapterId
        required: true
        schema:
          format: uuid
          title: Chapterid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      summary: Action Publish Chapter
  /edit-chapter-data/{chapterId}:
    post:
      description: "Gets all data associated with a chapter required for editing.\n\
        \nArgs:\n    chapter_id: Chapter id of requested chapter\n    eager: List\
        \ of label group IDs for which to fetch eager label data\n\nRaises:\n    404:\
        \ Chapter not found (or insufficient permissions).\n    403: Insufficient\
        \ permissions to access data for other user."
