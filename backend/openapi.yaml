        \    404: Chapter not found (or insufficient permissions).\n    403: Insufficient\
        \ permissions to access data for other user."
      operationId: read_edit_chapter_label_data_edit_chapter_data__chapterId__label_data_post
      parameters:
      - in: path
        name: chapterId
        required: true
        schema:
          format: uuid
          title: Chapterid
          type: string
      - in: query
        name: subjectId
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Subjectid
      requestBody:
        content:
          application/json:
            schema:
              description: Label group IDs to fetch label data and labels for
              items:
                format: uuid
