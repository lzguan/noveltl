                title: Response Read Edit Chapter Label Data Edit Chapter Data  Chapterid  Label
                  Data Post
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
