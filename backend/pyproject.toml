[project]
name = "noveltl-dev"
version = "0.1.0"
description = "Novel translation backend"
authors = [{ name = "Leo Guan", email = "leo.ziqi@gmail.com" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "sqlalchemy>=2.0.40",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.2.0",
    "alembic>=1.13.0",
    "celery[redis]>=5.6.3",
    "redis[hiredis]>=6.4.0",
]

[dependency-groups]
backend = [
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "pyjwt>=2.9.0",
    "argon2-cffi>=23.0.0",
    "pwdlib>=0.3.0",
    "python-multipart>=0.0.32",
]
worker = [
    "transformers>=5.15.0",
    "torch>=2.9.1",
    "hf>=1.27.0",
]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.11",
    "coverage>=7.13.4",
    "pyrefly>=1.2.0",
    "types-psycopg2>=2.9.21.20260408",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260518",
    "celery-types>=0.26.0",
]
agent = [
    "pydantic-ai>=2.31.0",
]

[tool.uv]
package = true
default-groups = [
    "backend",
    "worker",
    "dev",
    "agent"
]
required-version = ">=0.10.0"

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "torch-cpu" }

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
include = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(message)s"
markers = [
    "agent: marks tests that call a live LLM provider and may incur cost",
    "implementation: marks heavy model implementation tests",
    "slow: marks tests that take a long time",
]
addopts = "-ra -q -m 'not slow'"

[tool.ruff]
target-version = "py312"

line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.pyrefly]
project-includes = ["src", "tests", "scripts", "test_support"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "**/.venv/**",
    "**/.git/**"
]
infer-with-first-use = false
search-path = ["."]
