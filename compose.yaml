x-db-env: &db-env
  DB_HOST: db
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_URL: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}

x-test-db-env: &test-db-env
  TEST_HOST: test_db
  TEST_USER: ${TEST_USER}
  TEST_PASSWORD: ${TEST_PASSWORD}
  TEST_NAME: ${TEST_NAME}
  TEST_URL: postgresql+psycopg2://${TEST_USER}:${TEST_PASSWORD}@test_db:5432/${TEST_NAME}

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_PORT}

x-test-redis-env: &test-redis-env
  TEST_REDIS_HOST: test_redis
  TEST_REDIS_PORT: ${TEST_REDIS_PORT}

x-file-store-env: &file-store-env
  FILE_STORE_NAME: ${FILE_STORE_NAME:-default}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
  S3_BUCKET: ${S3_BUCKET:-noveltl}
  S3_REGION: ${S3_REGION:-garage}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

services:
  dev:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-devcontainer:${DEV_IMAGE_TAG:-latest}
    environment:
      <<: [*db-env, *test-db-env, *redis-env, *test-redis-env, *file-store-env]
      SECRET_KEY: ${SECRET_KEY}
      HF_TOKEN: ${HF_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    command: sleep infinity

  db:
    image: postgres:18
    restart: always

    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      
    volumes:
      - db_data:/var/lib/postgresql

  test_db:
    image: postgres:18
    restart: always
      
    environment:
      POSTGRES_USER: "${TEST_USER}"
      POSTGRES_PASSWORD: "${TEST_PASSWORD}"
      POSTGRES_DB: "${TEST_NAME}"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    profiles:
      - test
  redis:
    image: redis
  test_redis:
    image: redis

  autolabels-worker:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-autolabels-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      - db
      - redis
    environment:
      <<: [*db-env, *redis-env]
      UV_COMPILE_BYTECODE: false
      SECRET_KEY: ${SECRET_KEY} # purely to not crash on startup
    volumes:
      - ./backend:/home/newuser/backend
      - /home/newuser/backend/.venv
      - ./logs:/home/newuser/backend/logs
    profiles:
      - manual

  filters-worker:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-filters-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      - db
      - redis
    environment:
      <<: [*db-env, *redis-env]
      UV_COMPILE_BYTECODE: false
      SECRET_KEY: ${SECRET_KEY} # purely to not crash on startup
    volumes:
      - ./backend:/home/newuser/backend
      - /home/newuser/backend/.venv
      - ./logs:/home/newuser/backend/logs
    profiles:
      - manual

  memory-agent-worker:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-memory-agent-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      - db
      - redis
    environment:
      <<: [*db-env, *redis-env]
      UV_COMPILE_BYTECODE: false
      SECRET_KEY: ${SECRET_KEY} # purely to not crash on startup
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MEMORY_AGENT_LOG_DIR: ${MEMORY_AGENT_LOG_DIR:-logs}
      MEMORY_AGENT_LOG_FILENAME: ${MEMORY_AGENT_LOG_FILENAME}
    volumes:
      - ./backend:/home/newuser/backend
      - /home/newuser/backend/.venv
      - ./docs/memory/agent-evals/logs:/home/newuser/backend/logs
    profiles:
      - manual

  backend:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-backend-dev:${DEV_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      - db
      - redis
    environment:
      <<: [*db-env, *redis-env, *file-store-env]
      PYTHONDONTWRITEBYTECODE: "1"
      SECRET_KEY: ${SECRET_KEY}
      BACKEND_LOG_DIR: ${BACKEND_LOG_DIR:-logs}
    volumes:
      - ./backend:/home/newuser/backend
      - /home/newuser/backend/.venv
      - ./logs:/home/newuser/backend/logs
    ports:
      - "${BACKEND_PORT}:8000"

  frontend:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-frontend-dev:${DEV_IMAGE_TAG:-latest}
    pull_policy: always
    volumes:
      - ./frontend:/home/newuser/frontend
      - /home/newuser/frontend/node_modules
    ports:
      - "${FRONTEND_PORT}:5173"
  
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET to a 32-byte hex secret}
      GARAGE_DEFAULT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID for Garage S3 access}
      GARAGE_DEFAULT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY for Garage S3 access}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-noveltl}
    volumes:
      - ./garage.toml:/etc/garage.toml
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "3900:3900"

volumes:
  db_data:
  garage_meta:
  garage_data:
