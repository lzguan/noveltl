x-db-env: &db-env
  DB_HOST: db
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}

x-test-db-env: &test-db-env
  TEST_HOST: test_db
  TEST_USER: ${TEST_USER}
  TEST_PASSWORD: ${TEST_PASSWORD}
  TEST_NAME: ${TEST_NAME}
  TEST_URL: postgresql+psycopg://${TEST_USER}:${TEST_PASSWORD}@test_db:5432/${TEST_NAME}

x-reader-db-env: &reader-db-env
  READER_DB_URL: postgresql+psycopg://${READER_DB_USER:-reader}:${READER_DB_PASSWORD:-reader}@reader_db:5432/${READER_DB_NAME:-reader}

x-reader-test-db-env: &reader-test-db-env
  READER_TEST_DB_URL: postgresql+psycopg://${READER_TEST_USER:-reader_test}:${READER_TEST_PASSWORD:-reader_test}@reader_test_db:5432/${READER_TEST_NAME:-reader_test}

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: ${REDIS_PORT}

x-test-redis-env: &test-redis-env
  TEST_REDIS_HOST: test_redis
  TEST_REDIS_PORT: ${TEST_REDIS_PORT}

x-file-store-env: &file-store-env
  FILE_STORE_NAME: ${FILE_STORE_NAME:-default}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://garage:3900}
  S3_BUCKET: ${S3_BUCKET:-noveltl}
  S3_REGION: ${S3_REGION:-garage}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

x-duckdb-env: &duckdb-env
  DUCKDB_QUACK_TOKEN: ${DUCKDB_QUACK_TOKEN}

services:
  dev:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-devcontainer:${DEV_IMAGE_TAG:-latest}
    environment:
      <<: [*db-env, *test-db-env, *reader-db-env, *reader-test-db-env, *redis-env, *test-redis-env, *file-store-env, *duckdb-env]
      SECRET_KEY: ${SECRET_KEY}
    command: sleep infinity

  db:
    image: postgres:18
    restart: always

    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      
    volumes:
      - db_data:/var/lib/postgresql

  test_db:
    image: postgres:18
    restart: always
    # Disposable test data: keep it in RAM and skip durability work.
    tmpfs:
      - /var/lib/postgresql:size=1g
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: "${TEST_USER}"
      POSTGRES_PASSWORD: "${TEST_PASSWORD}"
      POSTGRES_DB: "${TEST_NAME}"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    profiles:
      - test

  reader_db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: "${READER_DB_USER:-reader}"
      POSTGRES_PASSWORD: "${READER_DB_PASSWORD:-reader}"
      POSTGRES_DB: "${READER_DB_NAME:-reader}"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - reader_db_data:/var/lib/postgresql

  reader_test_db:
    image: postgres:18
    restart: always
    tmpfs:
      - /var/lib/postgresql:size=1g
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: "${READER_TEST_USER:-reader_test}"
      POSTGRES_PASSWORD: "${READER_TEST_PASSWORD:-reader_test}"
      POSTGRES_DB: "${READER_TEST_NAME:-reader_test}"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    profiles:
      - test

  redis:
    image: redis
  test_redis:
    image: redis

  autolabels-worker:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-autolabels-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      - db
      - redis
    environment:
      <<: [*db-env, *redis-env]
      UV_COMPILE_BYTECODE: false
      SECRET_KEY: ${SECRET_KEY} # purely to not crash on startup
    volumes:
      - ./backend:/home/newuser/backend
      - /home/newuser/backend/.venv
      - ./logs:/home/newuser/backend/logs
    profiles:
      - manual

  filters-worker:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-filters-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      - db
      - redis
    environment:
      <<: [*db-env, *redis-env]
      UV_COMPILE_BYTECODE: false
      SECRET_KEY: ${SECRET_KEY} # purely to not crash on startup
    volumes:
      - ./backend:/home/newuser/backend
      - /home/newuser/backend/.venv
      - ./logs:/home/newuser/backend/logs
    profiles:
      - manual

  jobs-worker:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-jobs-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      - db
      - redis
    environment:
      <<: [*db-env, *redis-env]
      UV_COMPILE_BYTECODE: false
      SECRET_KEY: ${SECRET_KEY} # purely to not crash on startup
    volumes:
      - ./backend:/home/newuser/backend
      - /home/newuser/backend/.venv
      - ./logs:/home/newuser/backend/logs

  # Sends periodic maintenance tasks to the jobs queue when due. Run exactly one.
  jobs-scheduler:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-jobs-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["uv", "run", "--no-sync", "taskiq", "scheduler", "src.jobs.broker:scheduler", "src.autolabels.promotions.tasks"]
    depends_on:
      - redis
    environment:
      <<: [*db-env, *redis-env]
      UV_COMPILE_BYTECODE: "0"
      SECRET_KEY: ${SECRET_KEY} # shared config validates this on startup
    volumes:
      - ./backend:/home/newuser/backend
      - /home/newuser/backend/.venv

  memory-agent-worker:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-memory-agent-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      - db
      - redis
    environment:
      <<: [*db-env, *redis-env]
      UV_COMPILE_BYTECODE: false
      SECRET_KEY: ${SECRET_KEY} # purely to not crash on startup
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      INCEPTION_API_KEY: ${INCEPTION_API_KEY:-}
      MEMORY_AGENT_LOG_DIR: ${MEMORY_AGENT_LOG_DIR:-logs}
      MEMORY_AGENT_LOG_FILENAME: ${MEMORY_AGENT_LOG_FILENAME}
    volumes:
      - ./backend:/home/newuser/backend
      - /home/newuser/backend/.venv
      - ./docs/memory/agent-evals/logs:/home/newuser/backend/logs
    profiles:
      - manual

  translations-worker:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-translations-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      - db
      - redis
      - garage
    environment:
      <<: [*db-env, *redis-env, *file-store-env]
      UV_COMPILE_BYTECODE: "0"
      SECRET_KEY: ${SECRET_KEY} # shared config validates this on startup
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_API_URL: ${QWEN_API_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-https://openrouter.ai/api/v1}
    volumes:
      - ./backend:/home/newuser/backend
      - /home/newuser/backend/.venv
      - ./logs:/home/newuser/backend/logs
    profiles:
      - manual

  # Sends delayed translation polls to the queue when due. Run exactly one.
  translations-scheduler:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-translations-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ["uv", "run", "--no-sync", "taskiq", "scheduler", "src.translations.broker:scheduler", "--update-interval", "5"]
    depends_on:
      - redis
    environment:
      <<: [*db-env, *redis-env]
      UV_COMPILE_BYTECODE: "0"
      SECRET_KEY: ${SECRET_KEY} # shared config validates this on startup
    volumes:
      - ./backend:/home/newuser/backend
      - /home/newuser/backend/.venv
    profiles:
      - manual

  backend:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-backend-dev:${DEV_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      - db
      - redis
    environment:
      <<: [*db-env, *redis-env, *file-store-env]
      PYTHONDONTWRITEBYTECODE: "1"
      SECRET_KEY: ${SECRET_KEY}
      BACKEND_LOG_DIR: ${BACKEND_LOG_DIR:-logs}
    # Reload against the bind-mounted source. The image CMD has no --reload,
    # since the same Dockerfile target builds the production image. Watching
    # only src keeps the reloader off the .venv volume; without watchfiles in
    # the image, uvicorn polls, so the narrower directory matters.
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --reload
      - --reload-dir
      - src
    volumes:
      - ./backend:/home/newuser/backend
      - /home/newuser/backend/.venv
      - ./logs:/home/newuser/backend/logs
    ports:
      - "${BACKEND_PORT}:8000"

  frontend:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-frontend-dev:${DEV_IMAGE_TAG:-latest}
    pull_policy: always
    volumes:
      - ./frontend:/home/newuser/frontend
      - /home/newuser/frontend/node_modules
    ports:
      - "${FRONTEND_PORT}:5173"

  reader-api:
    build:
      context: ./reader-api
      target: reader-api
    depends_on:
      - reader_db
    environment:
      <<: [*reader-db-env]
      PYTHONDONTWRITEBYTECODE: "1"
      READER_PUBLIC_BASE_URL: ${READER_PUBLIC_BASE_URL:-http://localhost:5174}
      READER_INSTANCE_NAME: ${READER_INSTANCE_NAME:-NovelTL Reader}
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
      - --reload-dir
      - src
    volumes:
      - ./reader-api:/home/newuser/reader-api
      - /home/newuser/reader-api/.venv
    ports:
      - "${READER_API_PORT:-8001}:8001"

  reader:
    image: ghcr.io/${GHCR_OWNER:-lzguan}/noveltl-reader-dev:${DEV_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      - reader-api
    environment:
      READER_BACKEND_URL: http://reader-api:8001
    volumes:
      - ./reader:/home/newuser/reader
      - /home/newuser/reader/node_modules
    ports:
      - "${READER_PORT:-5174}:5173"
  
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET to a 32-byte hex secret}
      GARAGE_DEFAULT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID for Garage S3 access}
      GARAGE_DEFAULT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY for Garage S3 access}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-noveltl}
    volumes:
      - ./garage.toml:/etc/garage.toml
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"

  duckdb:
    image: duckdb/duckdb:2.0.0
    volumes:
      - ./analytics/.data:/data
    # The shell starts a Quack server (port 9494) and stays open to keep it running.
    entrypoint:
      - /duckdb
      - -dark-mode
      - -cmd
      - "CALL quack_serve('quack:0.0.0.0:9494', allow_other_hostname = true, token = '${DUCKDB_QUACK_TOKEN}', disable_ssl = true);"
      - /data/store.duckdb
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:9494:9494"

volumes:
  db_data:
  reader_db_data:
  garage_meta:
  garage_data:
