[project]
name = "noveltl-evals"
version = "0.1.0"
description = "Evaluation tooling for NovelTL"
requires-python = ">=3.15,<3.16"
dependencies = [
    "noveltl-dev",
    "pydantic>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pyrefly>=1.4.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = true
default-groups = ["dev"]
required-version = ">=0.13.6"

[tool.uv.sources]
noveltl-dev = { path = "../backend", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyrefly]
project-includes = ["src", "tests"]
project-excludes = ["**/__pycache__", "**/.*", "**/.venv/**"]
infer-with-first-use = false
