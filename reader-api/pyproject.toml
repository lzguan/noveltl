[project]
name = "noveltl-reader-api"
version = "0.1.0"
description = "Public Reader API and ingest service for NovelTL"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.16.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.3",
    "pyrefly>=1.5.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.uv]
package = true
default-groups = ["dev"]
required-version = ">=0.13.6"

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
include = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"

[tool.ruff]
target-version = "py315"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "**/.venv/**",
    "**/.git/**",
]
infer-with-first-use = false
search-path = ["."]
